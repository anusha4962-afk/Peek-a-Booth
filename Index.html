document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"353465a6-a087-4abe-adef-069ee197f881\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* latin */\n@font-face {\n  font-family: 'Beth Ellen';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c7fc9d84-3bd9-4b1d-b50d-71792c7832c5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: #f3f6f0; }\n  * { box-sizing: border-box; }\n  a { color: #c9584f; text-decoration: none; }\n  a:hover { color: #9c3f38; }\n  input, button { font-family: inherit; }\n  ::selection { background: #f6d9a8; color: #2b2f28; }\n  @keyframes bp-flash { 0% { opacity: 0 } 8% { opacity: .95 } 100% { opacity: 0 } }\n  @keyframes bp-pop { 0% { transform: scale(.7); opacity: 0 } 60% { transform: scale(1.06); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }\n  @keyframes bp-rise { 0% { transform: translateY(14px); opacity: 0 } 100% { transform: translateY(0); opacity: 1 } }\n  @keyframes bp-slot { 0% { max-height: 0 } 100% { max-height: 1800px } }\n  @keyframes bp-feed { 0% { transform: translateY(-100%) } 88% { transform: translateY(0) } 92% { transform: translateY(-6px) } 100% { transform: translateY(0) } }\n  @keyframes bp-rattle { 0%, 100% { transform: translateX(0) } 25% { transform: translateX(-1.5px) } 75% { transform: translateX(1.5px) } }\n  @keyframes bp-shakehint { 0%, 70%, 100% { transform: rotate(0) } 78% { transform: rotate(-7deg) } 86% { transform: rotate(7deg) } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; background-color: #f4f7f1; background-image: repeating-linear-gradient(0deg, rgba(118,164,133,.20) 0 24px, transparent 24px 48px), repeating-linear-gradient(90deg, rgba(118,164,133,.20) 0 24px, transparent 24px 48px); font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; color: #2b2f28; padding: 14px 14px 26px; display: flex; flex-direction: column; align-items: center; gap: 12px;\">\n\n  <div style=\"width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 8px;\">\n    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;\">\n      <div style=\"font-family: 'Beth Ellen', cursive; font-size: clamp(30px, 6vw, 48px); line-height: 1.15; padding-top: 6px; transform: rotate(-1.6deg);\">{{ headline }}<\u002Fdiv>\n      <div style=\"display: flex; gap: 14px; align-items: baseline; font-family: 'Beth Ellen', cursive; font-size: 22px;\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"{{ s.chipStyle }}\">\n            <span style=\"font-size: 15px; opacity: .65;\">{{ s.num }}<\u002Fspan>\n            <span>{{ s.label }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size: 16px; color: #6f7a6d;\">three little steps &amp; you take home a paper strip<\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isSetup }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 24px; animation: bp-rise .4s ease both;\">\n\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 14px; border: 1.5px solid rgba(43,47,40,.16); background: rgba(255,254,248,.86);\">\n        <div style=\"display: flex; align-items: baseline; gap: 10px;\">\n          <span style=\"font-family: 'Beth Ellen', cursive; font-size: 30px; \">1. paper &amp; texture<\u002Fspan>\n          <span style=\"font-size: 14px; color: #7b8278;\">pick what your strip is printed on<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px;\">\n          <sc-for list=\"{{ frames }}\" as=\"f\" hint-placeholder-count=\"8\">\n            <button type=\"button\" sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.cardStyle }}\" style-hover=\"transform: translateY(-2px) rotate(-1deg)\">\n              <span style=\"{{ f.swatchStyle }}\"><\u002Fspan>\n              <span style=\"font-family: 'Beth Ellen', cursive; font-size: 19px; line-height: 1;\">{{ f.label }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 18px; flex-wrap: wrap;\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 14px; border: 1.5px solid rgba(43,47,40,.16); background: rgba(255,254,248,.86); flex: 1; min-width: 260px;\">\n          <span style=\"font-family: 'Beth Ellen', cursive; font-size: 30px; \">2. how many frames?<\u002Fspan>\n          <div style=\"display: flex; gap: 10px;\">\n            <sc-for list=\"{{ shotOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\">\n                <span style=\"display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: center;\">\n                  <sc-for list=\"{{ o.bars }}\" as=\"b\" hint-placeholder-count=\"3\">\n                    <span style=\"{{ b.style }}\"><\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 14px; border: 1.5px solid rgba(43,47,40,.16); background: rgba(255,254,248,.86); flex: 1.2; min-width: 260px;\">\n          <span style=\"font-family: 'Beth Ellen', cursive; font-size: 30px; \">3. say something<\u002Fspan>\n          <input type=\"text\" value=\"{{ caption }}\" sc-camel-on-input=\"{{ onCaption }}\" sc-camel-max-length=\"26\" placeholder=\"hello from august\" style=\"width: 100%; padding: 8px 2px; border: none; border-bottom: 2px dashed rgba(43,47,40,.3); background: transparent; font-family: 'Beth Ellen', cursive; font-size: 30px; color: #2b2f28; outline: none;\" style-focus=\"border-bottom-color: #c9584f\">\n          <span style=\"font-size: 13px; color: #7b8278;\">{{ captionCount }}/26 — written under the last frame<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 14px; flex-wrap: wrap;\">\n        <span style=\"font-size: 14px; color: #7b8278;\">camera permission next · nothing leaves your device<\u002Fspan>\n        <button type=\"button\" sc-camel-on-click=\"{{ goShoot }}\" style=\"{{ primaryBtn }}\" style-hover=\"transform: translateY(-2px) rotate(-1deg)\">enter the booth →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isShoot }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 14px; animation: bp-rise .4s ease both;\">\n      <div style=\"position: relative; height: {{ stageH }}; aspect-ratio: 4 / 3; width: auto; margin: 0 auto; max-width: 100%; border-radius: 14px; overflow: hidden; background: #22261f; border: 3px solid #2b2f28;\">\n        <video ref=\"{{ videoRef }}\" sc-camel-auto-play=\"{{ true }}\" sc-camel-plays-inline=\"{{ true }}\" muted=\"{{ true }}\" sc-camel-on-loaded-metadata=\"{{ onVideoReady }}\" sc-camel-on-can-play=\"{{ onVideoReady }}\" style=\"{{ videoStyle }}\"><\u002Fvideo>\n        <div style=\"{{ flashStyle }}\"><\u002Fdiv>\n        <div style=\"{{ countStyle }}\">{{ countLabel }}<\u002Fdiv>\n        <div style=\"position: absolute; left: 12px; top: 12px; padding: 4px 12px; border-radius: 999px; background: rgba(255,254,248,.9); font-family: 'Beth Ellen', cursive; font-size: 20px; color: #2b2f28;\">{{ shotLabel }}<\u002Fdiv>\n        <div style=\"position: absolute; right: 12px; bottom: 10px; font-family: 'Beth Ellen', cursive; font-size: 21px; color: rgba(255,254,248,.85);\">{{ filterLabel }}<\u002Fdiv>\n        <sc-if value=\"{{ camErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; overflow: auto; text-align: center; background: #22261f; color: #fffef8;\">\n            <span style=\"font-family: 'Beth Ellen', cursive; font-size: 26px; line-height: 1.3;\">the lens is covered!<\u002Fspan>\n            <span style=\"font-size: 13px; line-height: 1.45; color: rgba(255,254,248,.75); max-width: 330px;\">{{ camErr }}<\u002Fspan>\n            <div style=\"display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px;\">\n              <button type=\"button\" sc-camel-on-click=\"{{ retryCam }}\" style=\"{{ lightBtn }}\">try camera again<\u002Fbutton>\n              <sc-if value=\"{{ framed }}\" hint-placeholder-val=\"{{ false }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ openTab }}\" style=\"{{ lightBtn }}\">open in a new tab<\u002Fbutton>\n              <\u002Fsc-if>\n              <label style=\"{{ lightBtn }}\">upload photos<input type=\"file\" accept=\"image/*\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ onUpload }}\" style=\"display: none;\"><\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 10px;\">\n          <span style=\"font-family: 'Beth Ellen', cursive; font-size: 29px;\">filters<\u002Fspan>\n          <span style=\"font-size: 14px; color: #7b8278;\">10 film stocks + plain, live on the lens<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px;\">\n          <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"11\">\n            <button type=\"button\" sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.cardStyle }}\">\n              <span style=\"{{ f.swatchStyle }}\"><\u002Fspan>\n              <span style=\"font-family: 'Beth Ellen', cursive; font-size: 18px; white-space: nowrap;\">{{ f.label }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ shoot }}\" style=\"{{ shutterBtn }}\">{{ shutterLabel }}<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goSetup }}\" style=\"{{ ghostBtn }}\">← back<\u002Fbutton>\n        <div style=\"display: flex; gap: 6px; margin-left: auto;\">\n          <sc-for list=\"{{ thumbs }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"{{ t.style }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPrint }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width: 100%; max-width: 880px; display: flex; gap: 30px; flex-wrap: wrap; align-items: flex-start; animation: bp-rise .45s ease both;\">\n\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 12px; flex: 0 0 auto; margin: 0 auto;\">\n        <div style=\"{{ machineStyle }}\">\n          <div style=\"width: min(300px, 76vw); height: 12px; border-radius: 8px; background: #2b2f28; box-shadow: inset 0 3px 0 rgba(255,255,255,.18);\"><\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #7b8278; margin-top: 5px;\">{{ machineLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ slotStyle }}\">\n          <div style=\"{{ feedStyle }}\">\n            <div sc-camel-on-mouse-enter=\"{{ onStripEnter }}\" sc-camel-on-mouse-move=\"{{ onStripMove }}\" sc-camel-on-mouse-leave=\"{{ onStripLeave }}\" sc-camel-on-click=\"{{ onStripTap }}\" role=\"img\" aria-label=\"your photo strip\" style=\"{{ stripStyle }}\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ hintStyle }}\">{{ developHint }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 14px; min-width: 250px; flex: 1;\">\n        <div style=\"font-family: 'Beth Ellen', cursive; font-size: 21px; color: #4d554b; line-height: 1.5; border-left: 2px dashed rgba(43,47,40,.28); padding-left: 12px;\">{{ receipt }}<\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 13px 14px; border-radius: 14px; border: 1.5px solid rgba(43,47,40,.16); background: rgba(255,254,248,.86);\">\n          <span style=\"font-family: 'Beth Ellen', cursive; font-size: 26px; \">changed your mind? swap the paper<\u002Fspan>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 7px;\">\n            <sc-for list=\"{{ reframes }}\" as=\"f\" hint-placeholder-count=\"8\">\n              <button type=\"button\" sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.cardStyle }}\" style-hover=\"transform: translateY(-2px)\">\n                <span style=\"{{ f.swatchStyle }}\"><\u002Fspan>\n                <span style=\"font-family: 'Beth Ellen', cursive; font-size: 15px; line-height: 1;\">{{ f.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ printStrip }}\" style=\"{{ primaryBtn }}\" style-hover=\"transform: translateY(-2px) rotate(-1deg)\">print the strip<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ downloadStrip }}\" style=\"{{ ghostBtn }}\">download png<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ reshoot }}\" style=\"{{ ghostBtn }}\">retake photos<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ startOver }}\" style=\"{{ ghostBtn }}\">start over<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#c9584f&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#c9584f&quot;,&quot;#6fa88c&quot;,&quot;#8f86c9&quot;,&quot;#2b2f28&quot;],&quot;section&quot;:&quot;Booth&quot;},&quot;countdownSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Booth&quot;},&quot;sound&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Booth&quot;},&quot;showDateStamp&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Strip&quot;}}\">\nconst FRAMES = [\n  { id: 'gingham', label: 'gingham', ink: '#20362c', sub: '#6f8a7c',\n    swatch: 'repeating-linear-gradient(0deg,rgba(111,168,140,.5) 0 8px,transparent 8px 16px), repeating-linear-gradient(90deg,rgba(111,168,140,.5) 0 8px,transparent 8px 16px), #f2f6f0',\n    paint: (c, w, h) => { c.fillStyle = '#f2f6f0'; c.fillRect(0, 0, w, h); const s = 22;\n      for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) { const a = ((x / s | 0) + (y / s | 0)) % 2; c.fillStyle = a ? 'rgba(96,150,124,.16)' : 'rgba(96,150,124,.30)'; c.fillRect(x, y, s, s); }\n      for (let i = 0; i < 2600; i++) { c.fillStyle = 'rgba(255,255,255,.10)'; c.fillRect(Math.random() * w, Math.random() * h, 1.4, 1.4); } } },\n  { id: 'kraft', label: 'kraft', ink: '#3a2c1c', sub: '#7a6449',\n    swatch: 'linear-gradient(135deg,#dcc5a2,#cbb18c)',\n    paint: (c, w, h) => { c.fillStyle = '#dcc5a2'; c.fillRect(0, 0, w, h);\n      for (let i = 0; i < 5200; i++) { c.fillStyle = `rgba(${90 + Math.random() * 60|0},${66 + Math.random() * 40|0},${40 + Math.random() * 30|0},${.05 + Math.random() * .1})`; c.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2.4, 1 + Math.random() * 2); } } },\n  { id: 'linen', label: 'linen', ink: '#2a2721', sub: '#7d7565',\n    swatch: 'repeating-linear-gradient(0deg,#f4f0e5 0 3px,#eae5d7 3px 4px), repeating-linear-gradient(90deg,#f4f0e5 0 3px,#e8e3d4 3px 4px)',\n    paint: (c, w, h) => { c.fillStyle = '#f4f0e5'; c.fillRect(0, 0, w, h); c.lineWidth = 1;\n      for (let y = 0; y < h; y += 5) { c.strokeStyle = 'rgba(120,108,88,.10)'; c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }\n      for (let x = 0; x < w; x += 5) { c.strokeStyle = 'rgba(120,108,88,.07)'; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); } } },\n  { id: 'noir', label: 'noir', ink: '#fffdf7', sub: '#a29b8d',\n    swatch: 'repeating-linear-gradient(100deg,#1a1a1d 0 6px,#26262b 6px 9px)',\n    paint: (c, w, h) => { c.fillStyle = '#1a1a1d'; c.fillRect(0, 0, w, h);\n      for (let i = 0; i < 900; i++) { c.strokeStyle = `rgba(255,255,255,${.012 + Math.random() * .03})`; c.lineWidth = .6 + Math.random(); const y = Math.random() * h; c.beginPath(); c.moveTo(0, y); c.lineTo(w, y + (Math.random() * 8 - 4)); c.stroke(); } } },\n  { id: 'confetti', label: 'confetti', ink: '#241f2c', sub: '#7c7288',\n    swatch: 'radial-gradient(#e6785a 22%,transparent 23%) 0 0/14px 14px, radial-gradient(#6fa88c 22%,transparent 23%) 7px 7px/14px 14px, #fffdf8',\n    paint: (c, w, h) => { c.fillStyle = '#fffdf8'; c.fillRect(0, 0, w, h); const cols = ['#e6785a', '#6fa88c', '#e8bf55', '#8f86c9', '#e0879f'];\n      for (let i = 0; i < 260; i++) { c.fillStyle = cols[i % cols.length]; c.globalAlpha = .55 + Math.random() * .35; c.save(); c.translate(Math.random() * w, Math.random() * h); c.rotate(Math.random() * 3.2); c.fillRect(0, 0, 4 + Math.random() * 12, 3 + Math.random() * 4); c.restore(); } c.globalAlpha = 1; } },\n  { id: 'grid', label: 'graph', ink: '#1e3346', sub: '#6b8296',\n    swatch: 'repeating-linear-gradient(0deg,#f6f6f1 0 9px,#cfdce6 9px 10px), repeating-linear-gradient(90deg,#f6f6f1 0 9px,#cfdce6 9px 10px)',\n    paint: (c, w, h) => { c.fillStyle = '#f6f6f1'; c.fillRect(0, 0, w, h); c.lineWidth = 1;\n      for (let x = 0; x < w; x += 14) { c.strokeStyle = x % 70 === 0 ? 'rgba(50,100,140,.22)' : 'rgba(50,100,140,.11)'; c.beginPath(); c.moveTo(x + .5, 0); c.lineTo(x + .5, h); c.stroke(); }\n      for (let y = 0; y < h; y += 14) { c.strokeStyle = y % 70 === 0 ? 'rgba(50,100,140,.22)' : 'rgba(50,100,140,.11)'; c.beginPath(); c.moveTo(0, y + .5); c.lineTo(w, y + .5); c.stroke(); } } },\n  { id: 'terrazzo', label: 'terrazzo', ink: '#2b2723', sub: '#7f7568',\n    swatch: 'radial-gradient(#d9cfc0 18%,transparent 19%) 4px 6px/13px 13px, radial-gradient(#c9b6a3 16%,transparent 17%) 9px 2px/16px 16px, #f5f1e8',\n    paint: (c, w, h) => { c.fillStyle = '#f5f1e8'; c.fillRect(0, 0, w, h); const cols = ['#d9cfc0', '#c7b3a0', '#b9c7bc', '#e0c9a8', '#a9a29a'];\n      for (let i = 0; i < 520; i++) { c.fillStyle = cols[i % cols.length]; c.globalAlpha = .5 + Math.random() * .4; c.beginPath(); const x = Math.random() * w, y = Math.random() * h, r = 2 + Math.random() * 7;\n        for (let k = 0; k < 6; k++) { const a = k / 6 * 6.283, rr = r * (.6 + Math.random() * .6); k ? c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : c.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); c.fill(); } c.globalAlpha = 1; } },\n  { id: 'risograph', label: 'riso', ink: '#33202c', sub: '#8a6b7c',\n    swatch: 'radial-gradient(circle at 30% 30%,rgba(228,110,120,.55),transparent 60%), radial-gradient(circle at 70% 70%,rgba(90,140,200,.5),transparent 60%), #fdf9f2',\n    paint: (c, w, h) => { c.fillStyle = '#fdf9f2'; c.fillRect(0, 0, w, h);\n      for (let i = 0; i < 4200; i++) { const t = Math.random(); c.fillStyle = t > .5 ? `rgba(224,96,110,${.05 + Math.random() * .16})` : `rgba(74,124,190,${.05 + Math.random() * .14})`; const x = Math.random() * w, y = Math.random() * h; c.beginPath(); c.arc(x, y, .8 + Math.random() * 2.6, 0, 6.283); c.fill(); } } }\n];\n\nconst FILTERS = [\n  { id: 'plain', label: 'plain', css: 'none' },\n  { id: 'mono', label: 'mono', css: 'grayscale(1) contrast(1.08)' },\n  { id: 'noir', label: 'noir', css: 'grayscale(1) contrast(1.5) brightness(.92)' },\n  { id: 'sepia', label: 'sepia', css: 'sepia(.72) contrast(1.06) saturate(1.1)' },\n  { id: 'film400', label: 'film 400', css: 'saturate(.88) contrast(1.16) brightness(1.04)' },\n  { id: 'faded', label: 'faded', css: 'contrast(.82) saturate(.78) brightness(1.14)' },\n  { id: 'sunkissed', label: 'sunkissed', css: 'saturate(1.35) hue-rotate(-8deg) brightness(1.06)' },\n  { id: 'xerox', label: 'xerox', css: 'grayscale(1) contrast(2.4) brightness(1.12)' },\n  { id: 'crossp', label: 'cross-process', css: 'sepia(.3) saturate(1.9) hue-rotate(-18deg) contrast(1.1)' },\n  { id: 'dream', label: 'dreamy', css: 'blur(.7px) brightness(1.1) saturate(1.15) contrast(.95)' },\n  { id: 'aura', label: 'aura', css: 'sepia(.45) saturate(2.2) hue-rotate(295deg) contrast(1.05)' }\n];\n\nconst PW = 560, PH = 420, PAD = 26, GAP = 13, CAPH = 108, S = 2;\nconst FEED_MS = 2100;\n\nclass Component extends DCLogic {\n  state = { step: 1, frame: 'gingham', shots: 3, caption: '', filter: 'plain', photos: [], counting: 0, flash: 0,\n    camErr: null, stripUrl: null, stripW: 612, stripH: 1400, running: false, exposure: 1,\n    printedAt: 0,
